<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Saudação</title>
</head>
<body>

    <button onclick="Saudacoes()">Clique aqui</button>
    <h1 id="mensagem" style="display: none;"></h1>
<!-- Botao ira chamar a funcao saudacoes -->
    <script>
        // Cria duas constantes a const agora e a const hora
        function Saudacoes() {
            const agora = new Date();
            // new date para receber data e hora do computador
            const hora = agora.getHours();
            let saudacao;
            
            switch (true) {
                case (hora < 12):
            saudacao = "Bom dia";
            break;
                case (hora < 18):
            saudacao = "Boa tarde";
            break;
            default:
            saudacao = "Boa noite";
}
            const dataHora = agora.toLocaleString('pt-BR');
            const mensagem = saudacao + "Agora são " + dataHora + ".";

            document.getElementById("mensagem").textContent = mensagem;
            document.getElementById("mensagem").style.display = "block";
        }
    </script>

</body>
</html>
