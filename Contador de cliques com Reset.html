<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contador de Cliques</title>
</head>
<body>
    <div id="contador">Cliques: 0</div><br>
    <button onclick="contarCliques()">Clique aqui</button>
    <button onclick="resetarContagem()">Resetar Contagem</button> 
<body>  
    <script>
        let cliques = 0;
        function contarCliques() {
            cliques++;
            document.getElementById("contador").textContent = "Cliques: " + cliques;
            }
        function resetarContagem() {
            cliques = 0;
            document.getElementById("contador").textContent = "Cliques: 0";
        }
    </script>   
</body>
</html>

<!-- criacao de comando para contagem de cliques funcao html -->
